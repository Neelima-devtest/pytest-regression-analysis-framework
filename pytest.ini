[pytest]
#Note - this file should always be in the root directory of the project
#This file configures pytest settings for the project and also makes the project more shareable.
#Define markers for categorizing tests


markers=
    smoke: mark tests as smoke tests
    regression: mark tests as regression tests
    addition: mark tests related to addition operation
    subtraction: mark tests related to subtraction operation
    functional: mark tests as functional tests

#Specify the directory where test files are located
testpaths = tests

pythonpath = .

#show all print and log outputs during test execution
; Trivia : In pytest.ini, both ';' and '#' can be used for comments.
# Command to generate reports with timestamped filenames
# python3 -m pytest \
#   --html="reports/$(date +%Y_%m_%d_%H-%M-%S)_report.html" \
#   --cov=app --cov-report="html:reports/$(date +%Y_%m_%d_%H-%M-%S)_coverage_html"

addopts = -s -v --html=reports/results_report.html --self-contained-html  --cov=app --cov-report=html:reports/coverage_report_html --reruns 2 --reruns-delay 2

#Enable logging for test execution
log_cli_level = INFO
log_cli = true
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format=%Y-%m-%d %H:%M:%S

log_file = test.log
log_file_level = INFO
log_file_format = %(asctime)s [%(levelname)s] %(message)s
log_file_date_format=%Y-%m-%d %H:%M:%S